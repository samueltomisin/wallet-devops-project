version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: wallet_postgres
    environment:
      POSTGRES_USER: wallet_admin
      POSTGRES_PASSWORD: secure_pass_000
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet_admin"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wallet-network

  wallet-service:
    build: ./wallet-service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=wallet_db
      - DB_USER=wallet_admin
      - DB_PASSWORD=secure_pass_000
      - SERVICE_NAME=wallet-service
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wallet-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  bill-payment-service:
    build: ./bill-payment-service
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=bill_payment_db
      - DB_USER=wallet_admin
      - DB_PASSWORD=secure_pass_000
      - SERVICE_NAME=bill-payment-service
      - WALLET_SERVICE_URL=http://wallet-service:3001
      - NOTIFICATION_SERVICE_URL=http://notification-service:3003
    networks:
      - wallet-network
    depends_on:
      postgres:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  notification-service:
    build: ./notification-service
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=notification_db
      - DB_USER=wallet_admin
      - DB_PASSWORD=secure_pass_000
      - SERVICE_NAME=notification-service
    networks:
      - wallet-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  wallet-network:
    driver: bridge

volumes:
  postgres_data: